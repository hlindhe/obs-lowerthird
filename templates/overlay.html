<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <style>
    :root {
      --duration-in: 500ms;
      --duration-out: 500ms;
      --accent: #ffffff;
      --panel-bg: rgba(9, 12, 18, 0.78);
      --panel-border: rgba(255, 255, 255, 0.22);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.84);
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      color: var(--text);
    }

    .stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .lower-third {
      position: absolute;
      left: 72px;
      bottom: 72px;
      min-width: 520px;
      max-width: 860px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      padding: 20px 28px 20px 22px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(15, 21, 32, 0.88), var(--panel-bg));
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translate3d(-36px, 24px, 0) scale(0.985);
      transition:
        opacity var(--duration-out) ease,
        transform var(--duration-out) cubic-bezier(.2, .75, .3, 1);
    }

    .lower-third.is-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      transition-duration: var(--duration-in);
    }

    .logo-wrap {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .logo-wrap.is-hidden {
      display: none;
    }

    .party-logo {
      max-width: 64px;
      max-height: 64px;
      object-fit: contain;
    }

    .copy {
      min-width: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    }

    .name {
      margin: 0;
      font-size: clamp(34px, 3vw, 52px);
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.035em;
      white-space: nowrap;
    }

    .title {
      margin: 8px 0 0;
      font-size: clamp(18px, 1.55vw, 28px);
      line-height: 1.18;
      font-weight: 550;
      color: var(--muted);
      white-space: nowrap;
    }

    .title.is-hidden {
      display: none;
    }

    .accent-line {
      position: absolute;
      left: 22px;
      right: 28px;
      bottom: 0;
      height: 4px;
      border-radius: 999px 999px 0 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.15), var(--accent), rgba(255,255,255,0.15));
      opacity: 0.9;
    }

    @media (max-width: 900px) {
      .lower-third {
        left: 40px;
        right: 40px;
        bottom: 48px;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Lower Third Overlay">
    <section id="lowerThird" class="lower-third" aria-live="polite" aria-hidden="true">
      <div id="logoWrap" class="logo-wrap is-hidden">
        <img id="partyLogo" class="party-logo" alt="" decoding="async">
      </div>
      <div class="copy">
        <h1 id="name" class="name">Lower Third</h1>
        <p id="title" class="title is-hidden"></p>
      </div>
      <div class="accent-line" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    const lowerThird = document.getElementById('lowerThird');
    const nameEl = document.getElementById('name');
    const titleEl = document.getElementById('title');
    const logoWrap = document.getElementById('logoWrap');
    const partyLogo = document.getElementById('partyLogo');

    let lastDurationOut = 500;
    let reconnectTimer = null;

    function toDuration(value, fallback) {
      const parsed = Number(value);
      return Number.isFinite(parsed) && parsed >= 0 ? parsed : fallback;
    }

    function setDurations(durationIn, durationOut) {
      const inMs = toDuration(durationIn, 500);
      const outMs = toDuration(durationOut, lastDurationOut || 500);
      lastDurationOut = outMs;
      document.documentElement.style.setProperty('--duration-in', `${inMs}ms`);
      document.documentElement.style.setProperty('--duration-out', `${outMs}ms`);
    }

    function setLogo(party) {
      const cleanParty = String(party || '').trim().toLowerCase().replace(/\.png$/, '').replace(/[^a-z0-9_-]/g, '');
      if (!cleanParty) {
        logoWrap.classList.add('is-hidden');
        partyLogo.removeAttribute('src');
        return;
      }

      partyLogo.onerror = () => {
        logoWrap.classList.add('is-hidden');
        partyLogo.removeAttribute('src');
      };
      partyLogo.onload = () => {
        logoWrap.classList.remove('is-hidden');
      };
      partyLogo.src = `/assets/logos/${encodeURIComponent(cleanParty)}.png`;
      partyLogo.alt = cleanParty.toUpperCase();
    }

    function showLowerThird(payload) {
      setDurations(payload.duration_in, payload.duration_out);
      nameEl.textContent = payload.name || '';

      const title = String(payload.title || '').trim();
      titleEl.textContent = title;
      titleEl.classList.toggle('is-hidden', title.length === 0);

      setLogo(payload.party);
      lowerThird.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => lowerThird.classList.add('is-visible'));
    }

    function hideLowerThird(payload = {}) {
      setDurations(undefined, payload.duration_out);
      lowerThird.classList.remove('is-visible');
      window.setTimeout(() => lowerThird.setAttribute('aria-hidden', 'true'), lastDurationOut);
    }

    function connectEvents() {
      const source = new EventSource('/events');

      source.addEventListener('show', event => {
        showLowerThird(JSON.parse(event.data));
      });

      source.addEventListener('hide', event => {
        hideLowerThird(JSON.parse(event.data));
      });

      source.onerror = () => {
        source.close();
        if (!reconnectTimer) {
          reconnectTimer = window.setTimeout(() => {
            reconnectTimer = null;
            connectEvents();
          }, 1000);
        }
      };
    }

    connectEvents();
  </script>
</body>
</html>
